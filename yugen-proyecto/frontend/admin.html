<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Nekoya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="marquee">Nekoya · administración</div>

  <header class="site-header">
    <a class="wordmark" href="index.html">NEKOYA</a>
    <nav><a href="index.html">Ver tienda</a></nav>
  </header>

  <main class="admin">
    <!-- Acceso: solo el administrador entra -->
    <section id="admin-login" class="panel narrow">
      <h1 class="pixel-title">Entrar</h1>
      <form id="login-form" class="stack">
        <input name="email" type="email" placeholder="Correo" required aria-label="Correo">
        <input name="password" type="password" placeholder="Contraseña" required aria-label="Contraseña">
        <button type="submit" class="btn">Iniciar sesión</button>
        <p id="login-status" class="status" role="status"></p>
      </form>
    </section>

    <!-- Panel: alta de productos, visible tras iniciar sesión -->
    <section id="admin-panel" class="panel" hidden>
      <div class="panel-head">
        <h1 class="pixel-title">Nuevo producto</h1>
        <button id="logout" class="btn ghost" type="button">Cerrar sesión</button>
      </div>
      <form id="product-form" class="stack">
        <input name="name" placeholder="Nombre" required aria-label="Nombre">
        <select name="category" required aria-label="Categoría">
          <option value="llavero">Llavero</option>
          <option value="pin">Pin</option>
          <option value="figura">Figura</option>
          <option value="personaje">Personaje</option>
          <option value="otro">Otro</option>
        </select>
        <input name="anime" placeholder="Serie / anime" aria-label="Serie o anime">
        <input name="price" type="number" min="0" step="0.01" placeholder="Precio (USD)" required aria-label="Precio">
        <input name="stock" type="number" min="0" step="1" value="0" aria-label="Stock">
        <input name="image" type="url" placeholder="URL de imagen" aria-label="URL de imagen">
        <textarea name="description" rows="3" placeholder="Descripción" aria-label="Descripción"></textarea>
        <div class="form-foot">
          <button type="submit" class="btn">Guardar producto</button>
          <p id="product-status" class="status" role="status"></p>
        </div>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

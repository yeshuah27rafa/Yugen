<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Nekoya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">Nekoya<span class="dot"></span></a>
    <nav><a href="index.html">Ver tienda</a></nav>
  </header>

  <main class="admin">
    <!-- Acceso: solo el administrador puede entrar -->
    <section id="admin-login" class="form-card narrow">
      <h1>Entrar</h1>
      <form id="login-form">
        <label>Correo <input name="email" type="email" required></label>
        <label>Contraseña <input name="password" type="password" required></label>
        <button type="submit" class="btn">Iniciar sesión</button>
        <p id="login-status" class="status" role="status"></p>
      </form>
    </section>

    <!-- Panel: alta de productos (se muestra tras iniciar sesión) -->
    <section id="admin-panel" class="form-card" hidden>
      <div class="panel-head">
        <h1>Nuevo producto</h1>
        <button id="logout" class="btn ghost" type="button">Cerrar sesión</button>
      </div>
      <form id="product-form">
        <label>Nombre <input name="name" required></label>
        <label>Categoría
          <select name="category" required>
            <option value="llavero">Llavero</option>
            <option value="pin">Pin</option>
            <option value="figura">Figura</option>
            <option value="personaje">Personaje</option>
            <option value="otro">Otro</option>
          </select>
        </label>
        <label>Serie / anime <input name="anime"></label>
        <label>Precio (USD) <input name="price" type="number" min="0" step="0.01" required></label>
        <label>Stock <input name="stock" type="number" min="0" step="1" value="0"></label>
        <label>URL de imagen <input name="image" type="url"></label>
        <label>Descripción <textarea name="description" rows="3"></textarea></label>
        <button type="submit" class="btn">Guardar producto</button>
        <p id="product-status" class="status" role="status"></p>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

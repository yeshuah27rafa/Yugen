<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nekoya · Anime retro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Franija de anuncio (marquee): único bloque de color fuerte de la página -->
  <div class="marquee">Nekoya · piezas seleccionadas de anime psicológico y retro</div>

  <header class="site-header">
    <a class="wordmark" href="index.html">NEKOYA</a>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <!-- Portada: piezas flotando sobre el título, como una constelación -->
    <section class="hero">
      <div class="constellation" aria-hidden="true">
        <img class="float f1" src="https://placehold.co/400x400/FFFDF8/1F2A44?text=Pin" alt="">
        <img class="float f2" src="https://placehold.co/400x400/FFFDF8/8B1E2B?text=Llavero" alt="">
        <img class="float f3" src="https://placehold.co/400x400/FFFDF8/D9A441?text=Figura" alt="">
      </div>
      <h1>Piezas de anime que no encuentras en cualquier tienda</h1>
      <form id="search-form" class="search" role="search">
        <input id="search" type="search" placeholder="¿Qué serie buscas hoy?" aria-label="Buscar productos">
        <button type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
      <div class="chips" role="group" aria-label="Categorías">
        <button class="chip" data-category="" aria-pressed="true">Todo</button>
        <button class="chip" data-category="llavero" aria-pressed="false">Llaveros</button>
        <button class="chip" data-category="pin" aria-pressed="false">Pines</button>
        <button class="chip" data-category="figura" aria-pressed="false">Figuras</button>
        <button class="chip" data-category="personaje" aria-pressed="false">Personajes</button>
      </div>
    </section>

    <!-- Catálogo: tarjetas con imagen protagonista -->
    <section id="catalogo" class="catalog">
      <div id="grid" class="grid"></div>
    </section>

    <!-- Contacto: formulario real que se guarda en MongoDB -->
    <section id="contacto" class="contact">
      <div class="contact-copy">
        <h2>Escríbenos</h2>
        <p>¿Buscas una serie en específico? Cuéntanos cuál y la buscamos por ti.</p>
      </div>
      <form id="contact-form" class="contact-form">
        <input name="name" placeholder="Nombre" required aria-label="Nombre">
        <input name="email" type="email" placeholder="Correo" required aria-label="Correo">
        <textarea name="message" rows="4" placeholder="Tu mensaje" required aria-label="Mensaje"></textarea>
        <div class="form-foot">
          <button type="submit" class="btn">Enviar mensaje</button>
          <p id="contact-status" class="status" role="status"></p>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Nekoya</span>
    <a href="admin.html">Administración</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

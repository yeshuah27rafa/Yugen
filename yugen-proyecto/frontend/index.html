<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nekoya · Anime retro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Encabezado con la marca provisional -->
  <header class="site-header">
    <a class="wordmark" href="index.html">Nekoya<span class="dot"></span></a>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <!-- Portada: promesa de la tienda y buscador -->
    <section class="hero">
      <h1>Piezas de anime que no encuentras en cualquier tienda.</h1>
      <p>Llaveros, pines, figuras y personajes de series que siguen vivas aunque ya no salgan en pantalla.</p>
      <form id="search-form" class="search" role="search">
        <input id="search" type="search" placeholder="¿Qué serie buscas?" aria-label="Buscar productos">
        <button type="submit">Buscar</button>
      </form>
    </section>

    <!-- Catálogo: filtros por categoría y tarjetas -->
    <section id="catalogo" class="catalog">
      <div class="filters" role="group" aria-label="Categorías">
        <button class="pill" data-category="" aria-pressed="true">Todo</button>
        <button class="pill" data-category="llavero" aria-pressed="false">Llaveros</button>
        <button class="pill" data-category="pin" aria-pressed="false">Pines</button>
        <button class="pill" data-category="figura" aria-pressed="false">Figuras</button>
        <button class="pill" data-category="personaje" aria-pressed="false">Personajes</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <!-- Contacto: formulario real que se guarda en MongoDB -->
    <section id="contacto" class="contact">
      <h2>Escríbenos</h2>
      <p>¿Buscas una serie en específico? Cuéntanos y la buscamos.</p>
      <form id="contact-form" class="form-card">
        <label>Nombre <input name="name" required></label>
        <label>Correo <input name="email" type="email" required></label>
        <label>Mensaje <textarea name="message" rows="4" required></textarea></label>
        <button type="submit" class="btn">Enviar mensaje</button>
        <p id="contact-status" class="status" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Nekoya</span>
    <a href="admin.html">Administración</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
